name: Build and Publish Docker Image

on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/docker-build.yml
    - build.sh
    - Dockerfile
  workflow_dispatch:
    inputs:
      release:
        description: landing-zone-accelerator-on-aws release tag to build (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REPO_NAME: ${{ github.event.repository.name }}
  # Release tag used for push-triggered builds. Override via workflow_dispatch input.
  DEFAULT_RELEASE: v1.9.2

jobs:
  build-and-publish:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: Run build script
      env:
        RELEASE: ${{ github.event.inputs.release || env.DEFAULT_RELEASE }}
      run: |
        bash build.sh "$RELEASE"
    
    - name: Login to ghcr
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Publish Docker Image
      run: docker push -a ghcr.io/home-office-digital/cc-lza-validator