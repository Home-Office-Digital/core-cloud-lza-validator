name: Dependabot Approval Issue

# Creates a tracking issue whenever Dependabot opens a pull request, so an
# engineer is prompted to review, approve and merge the update.

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: read

jobs:
  create-approval-issue:
    # Only run for PRs raised by Dependabot
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write   # raised from read: needed to edit the PR body
    steps:
      - name: Create approval tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request;

            // Avoid duplicates: skip if an issue already references this PR.
            const marker = `dependabot-pr:${pr.number}`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:body "${marker}"`,
            });
            if (existing.data.total_count > 0) {
              core.info(`Tracking issue already exists for PR #${pr.number}`);
              return;
            }

            const body = [
              `A Dependabot update is awaiting engineer review, approval and merge.`,
              ``,
              `**Pull request:** #${pr.number} — ${pr.title}`,
              `**Link:** ${pr.html_url}`,
              ``,
              `### Action required`,
              `- [ ] Review the proposed dependency change`,
              `- [ ] Confirm CI checks pass`,
              `- [ ] Approve the pull request`,
              `- [ ] Merge the pull request`,
              ``,
              `<!-- ${marker} -->`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Review Dependabot update: ${pr.title}`,
              body,
              labels: ['dependencies', 'needs-review'],
            });

            // Back-reference the tracking issue from the PR so the two are linked
            // on each other's timeline (GitHub's Development panel is only set from
            // the PR side or via manual UI linking; there is no issue-side API).
            const trackingMarker = '<!-- tracking-issue -->';
            if (!pr.body || !pr.body.includes(trackingMarker)) {
              const newBody = `${pr.body || ''}\n\nTracked by #${issue.data.number}\n${trackingMarker}`;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: newBody,
              });
            }