version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    reviewers:
      - "Home-Office-Digital/core-cloud-organisational-management"
    labels:
      - "dependencies"
      - "patch"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    reviewers:
      - "Home-Office-Digital/core-cloud-organisational-management"
    labels:
      - "dependencies"
      - "patch"
